services:
  - type: web
    name: transaction-webhook-service
    env: python
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.8
      - key: PROCESSING_DELAY_SECONDS
        value: 30
      - key: DATABASE_URL
        value: sqlite:///./transactions.db
